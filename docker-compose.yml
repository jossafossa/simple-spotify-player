# `docker compose up -d` builds and starts the whole app on port 3000.
#
# On Coolify, pick this repository with the Dockerfile or Docker Compose
# build pack and keep the defaults: Coolify gives it a domain with HTTPS
# (SERVICE_FQDN_APP_3000 asks it to route that domain to port 3000).
# Then add https://<that domain>/ as a Redirect URI in your Spotify app.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_APP_3000
    ports:
      - '${APP_PORT:-3000}:3000'
